name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Check script syntax
        run: |
          for f in pixabay-media/scripts/*.mjs; do
            node --check "$f"
          done

      - name: Validate plugin manifest
        run: claude plugin validate ./pixabay-media --strict

      - name: Validate marketplace manifest
        run: claude plugin validate ./.claude-plugin/marketplace.json

  smoke:
    name: Smoke test against mock API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # One step: the mock server is backgrounded here and torn down at the
      # end, so it never outlives the step that needs it.
      #
      # Assertions write to a file rather than piping into grep. A pipe into
      # `grep -q` closes the pipe early, which SIGPIPEs the writer and makes
      # `set -o pipefail` report failure for the wrong reason.
      - name: Search, download, and reject a bad key
        env:
          PIXABAY_API_BASE: http://127.0.0.1:8731
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/pixabay-cache
        run: |
          set -euo pipefail
          node pixabay-media/scripts/mock-pixabay.mjs 8731 &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8731/?key=TESTKEY" > /dev/null; then break; fi
            if [ "$i" = "30" ]; then echo "mock API did not come up" >&2; exit 1; fi
            sleep 1
          done

          echo "--- search images ---"
          PIXABAY_API_KEY=TESTKEY \
            node pixabay-media/scripts/pixabay.mjs search-images blossom --per-page 3 --json \
            > out.json
          grep -q '"id": 195893' out.json

          echo "--- download an image and write its sidecar ---"
          PIXABAY_API_KEY=TESTKEY \
            node pixabay-media/scripts/pixabay.mjs download-image 195893 \
              --dest "${{ runner.temp }}/assets" --size large
          test -f "${{ runner.temp }}/assets/"*.jpg
          test -f "${{ runner.temp }}/assets/"*.jpg.json

          echo "--- search videos ---"
          PIXABAY_API_KEY=TESTKEY \
            node pixabay-media/scripts/pixabay.mjs search-videos flowers --per-page 3 --json \
            > videos.json
          grep -q '"duration": 12' videos.json

          echo "--- reject a bad API key ---"
          set +e
          PIXABAY_API_KEY=INVALID \
            node pixabay-media/scripts/pixabay.mjs search-images blossom --per-page 3 \
            > badkey.txt 2>&1
          set -e
          grep -q "rejected the API key" badkey.txt
          echo "correctly rejected the bad key"
